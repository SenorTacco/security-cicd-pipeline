name: "Guvenlik Kapisi - CI/CD Boru Hatti"

# ============================================================
# TETIKLEYICILER: Ne zaman calisacak?
# ============================================================
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # Manuel tetikleme (test amacli)
  workflow_dispatch:

# Guvenlik: workflow'a sadece kod okuma izni ver
permissions:
  contents: read

# Ayni branch icin ust uste tetiklenen kosulari iptal et
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ============================================================
# ORTAM DEGISKENLERI
# ============================================================
env:
  PYTHON_VERSION: "3.11"
  SEMGREP_RULESETS: "p/python p/flask p/secrets p/owasp-top-ten"

# ============================================================
# IS AKISI (JOBS)
# ============================================================
jobs:

  # ----------------------------------------------------------
  # JOB 1: Guvenlik Kapisi - uretim kodunun (app/secure) taranmasi
  # ERROR seviyesinde bulgu varsa pipeline DURUR.
  # ----------------------------------------------------------
  security-gate:
    name: "Guvenlik Kapisi (Semgrep - app/secure)"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "Kodu cek (Checkout)"
        uses: actions/checkout@v7

      - name: "Python kur"
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: "Bagimliliklari yukle"
        run: |
          pip install -r app/requirements.txt
          pip install semgrep

      - name: "Semgrep Guvenlik Taramasi (uretim kodu)"
        run: |
          echo "=== Semgrep Taramasi Basliyor: app/secure/ ==="

          # Hazir kural setlerini --config argumanlarina cevir
          CONFIG_ARGS="--config semgrep/custom/"
          for ruleset in $SEMGREP_RULESETS; do
            CONFIG_ARGS="$CONFIG_ARGS --config $ruleset"
          done

          # JSON rapor olustur
          semgrep $CONFIG_ARGS \
            --json \
            --output semgrep-report.json \
            app/secure/ || true

          # Bulgulari degerlendir; ERROR varsa pipeline'i durdur
          python3 - <<'EOF'
          import json, sys

          with open("semgrep-report.json") as f:
              data = json.load(f)

          results = data.get("results", [])
          errors = [r for r in results if r.get("extra", {}).get("severity") == "ERROR"]
          warnings = [r for r in results if r.get("extra", {}).get("severity") == "WARNING"]

          print(f"Toplam bulgu: {len(results)} ({len(errors)} ERROR, {len(warnings)} WARNING)")
          for r in results:
              sev = r.get("extra", {}).get("severity", "?")
              path = r.get("path", "?")
              line = r.get("start", {}).get("line", "?")
              msg = r.get("extra", {}).get("message", "?").strip().splitlines()[0][:100]
              print(f"  [{sev}] {path}:{line} - {msg}")

          if errors:
              print(f"HATA: {len(errors)} adet ERROR seviyesinde guvenlik acigi bulundu!")
              sys.exit(1)
          print("BASARILI: Kritik guvenlik acigi bulunamadi.")
          EOF

      - name: "Semgrep Raporunu Kaydet"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-security-report
          path: semgrep-report.json
          retention-days: 30

      # Basarisizsa webhook ile bildir (Discord + Slack)
      - name: "Guvenlik Uyarisi Gonder"
        if: failure()
        run: |
          python3 notifications/send_alert.py \
            --report semgrep-report.json \
            --webhook-url "${{ secrets.DISCORD_WEBHOOK_URL }}" || true
          python3 notifications/send_alert.py \
            --report semgrep-report.json \
            --webhook-url "${{ secrets.SLACK_WEBHOOK_URL }}" \
            --platform slack || true

  # ----------------------------------------------------------
  # JOB 2: Kural Dogrulama - zafiyetli kod (app/vulnerable) taranir
  # ve Semgrep'in zafiyetleri YAKALADIGI kanitlanir.
  # Bulgu bulunamazsa kural seti bozulmus demektir -> pipeline durur.
  # ----------------------------------------------------------
  rule-verification:
    name: "Kural Dogrulama (Semgrep - app/vulnerable)"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "Kodu cek (Checkout)"
        uses: actions/checkout@v7

      - name: "Python kur"
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: "Semgrep yukle"
        run: pip install semgrep

      - name: "Zafiyetli Kodu Tara (bulgu BEKLENIYOR)"
        run: |
          echo "=== Kural Dogrulama: app/vulnerable/ taraniyor ==="

          CONFIG_ARGS="--config semgrep/custom/"
          for ruleset in $SEMGREP_RULESETS; do
            CONFIG_ARGS="$CONFIG_ARGS --config $ruleset"
          done

          semgrep $CONFIG_ARGS \
            --json \
            --output vulnerable-report.json \
            app/vulnerable/ || true

          # Zafiyetli kodda EN AZ 5 bulgu bekleniyor
          python3 - <<'EOF'
          import json, sys

          with open("vulnerable-report.json") as f:
              data = json.load(f)

          results = data.get("results", [])
          print(f"Zafiyetli kodda {len(results)} bulgu tespit edildi.")

          if len(results) < 5:
              print("HATA: Kural seti zafiyetleri yakalayamadi! Kurallar bozulmus olabilir.")
              sys.exit(1)
          print("BASARILI: Guvenlik kapisi zafiyetleri yakaliyor.")
          EOF

  # ----------------------------------------------------------
  # JOB 3: Testler - pytest ile guvenlik ve entegrasyon testleri
  # ----------------------------------------------------------
  tests:
    name: "Testler (pytest)"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "Kodu cek (Checkout)"
        uses: actions/checkout@v7

      - name: "Python kur"
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: "Bagimliliklari yukle"
        run: |
          pip install -r app/requirements.txt -r requirements-dev.txt
          pip install semgrep

      - name: "Testleri calistir"
        run: pytest tests/ -v --tb=short

  # ----------------------------------------------------------
  # JOB 4: Bagimlilik Denetimi - bilinen CVE'ler icin pip-audit
  # ----------------------------------------------------------
  dependency-audit:
    name: "Bagimlilik Denetimi (pip-audit)"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Kodu cek (Checkout)"
        uses: actions/checkout@v7

      - name: "Python kur"
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: "pip-audit calistir"
        run: |
          pip install pip-audit
          pip-audit -r app/requirements.txt

  # ----------------------------------------------------------
  # JOB 5: Docker Build (Tum guvenlik kontrolleri gecerse)
  # ----------------------------------------------------------
  docker-build:
    name: "Docker Build"
    runs-on: ubuntu-latest
    # GUVENLIK KAPISI: Tum kontroller gecmeden build yapilmaz
    needs: [security-gate, rule-verification, tests, dependency-audit]
    timeout-minutes: 10

    steps:
      - name: "Kodu cek"
        uses: actions/checkout@v7

      - name: "Docker Image Olustur"
        run: |
          docker build -t secure-api:${{ github.sha }} -f docker/Dockerfile .

      - name: "Build Basarili"
        run: echo "Docker image basariyla olusturuldu"

  # ----------------------------------------------------------
  # JOB 6: Deploy (Sadece build gecerse ve main branch'te)
  # ----------------------------------------------------------
  deploy:
    name: "Canliya Al (Deploy)"
    runs-on: ubuntu-latest
    needs: docker-build  # Build gecmeden deploy yapilmaz
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10

    steps:
      - name: "Kodu cek"
        uses: actions/checkout@v7

      - name: "Python kur"
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: "Deploy Simulasyonu"
        run: |
          echo "Tum guvenlik kontrolleri gecti!"
          echo "Docker build basarili!"
          echo "Uygulama canliya aliniyor..."
          echo "   (Gercek deploy komutu buraya gelecek)"

      - name: "Deploy Basari Bildirimi"
        run: |
          pip install requests
          python3 notifications/send_alert.py \
            --type success \
            --message "Deployment basarili: ${{ github.sha }}" \
            --webhook-url "${{ secrets.DISCORD_WEBHOOK_URL }}" || true
          python3 notifications/send_alert.py \
            --type success \
            --message "Deployment basarili: ${{ github.sha }}" \
            --webhook-url "${{ secrets.SLACK_WEBHOOK_URL }}" \
            --platform slack || true
