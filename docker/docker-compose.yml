services:
  # Ana uygulama
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - API_SECRET_KEY=${API_SECRET_KEY:-dev-secret-key}
      - DEBUG_MODE=false
      - DATABASE_PATH=/app/data/app.db
    env_file:
      # Hassas degiskenler .env'den okunur; dosya yoksa compose yine calisir
      - path: ../.env
        required: false
    volumes:
      # Kalici depolama: konteyner yeniden olusturulsa da veritabani korunur
      - db-data:/app/data
    restart: unless-stopped
    networks:
      - app-network

  # Semgrep tarama servisi (opsiyonel, CI/CD disinda lokal test icin)
  semgrep-scanner:
    # Guncel imaj adi semgrep/semgrep (returntocorp/semgrep eski isim)
    image: semgrep/semgrep:1.96.0
    volumes:
      - ../app:/src/app:ro
      - ../semgrep:/src/semgrep:ro
    command: >
      semgrep
        --config p/python
        --config p/flask
        --config p/secrets
        --config /src/semgrep/custom/
        --json
        /src/app/
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  # SQLite veritabanini konteyner yasam dongusunden bagimsiz saklar
  db-data:
